<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>all_OS · Plataforma de Simulação Clínica</title>

  <!-- Tema: aplica o modo escuro salvo ANTES do paint pra não piscar claro.
       Arquivo externo (não inline) porque o CSP do servidor é script-src 'self'
       sem 'unsafe-inline'. Síncrono de propósito. -->
  <script src="/theme-init.js"></script>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#14564E" />
  <meta name="application-name" content="all_OS" />
  <meta name="description" content="Plataforma de simulação clínica da Associação Allos." />

  <!-- iOS: instala via Compartilhar → Adicionar à tela de início, abre em fullscreen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="all_OS" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
